plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Procesa google-services.json en tiempo de compilacion. Sin esto, Firebase
    // Analytics NO reporta en Android (por eso GA4 solo mostraba iOS).
    // OJO: al aplicarlo, FirebaseInitProvider crea la app [DEFAULT] ANTES de que
    // arranque Dart, asi que main.dart debe llevar el guard Firebase.apps.isEmpty
    // o lanza [core/duplicate-app] y la app se queda en pantalla blanca.
    id "com.google.gms.google-services"
}

android {
    namespace "com.zoomubik.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    signingConfigs {
        release {
            keyAlias System.getenv("CM_KEY_ALIAS")
            keyPassword System.getenv("CM_KEY_PASSWORD")
            storeFile file(System.getenv("CM_KEYSTORE_PATH") ?: "upload-keystore.jks")
            storePassword System.getenv("CM_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.zoomubik.webview"
        minSdk flutter.minSdkVersion
        // 36 = Android 16, exigido por Play desde el 31-08-2026.
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}
