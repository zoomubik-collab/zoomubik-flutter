plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Procesa google-services.json en tiempo de compilacion. Sin esto, Firebase
    // Analytics NO se inicializa en Android (por eso GA4 solo mostraba iOS).
    id "com.google.gms.google-services"
}

android {
    namespace "com.zoomubik.app"
    // Fijados a mano (36 = Android 16). Antes venian de flutter.compileSdkVersion
    // y flutter.targetSdkVersion, que con Flutter 3.35.7 daban 35 y Play exige 36
    // a partir del 31-08-2026.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    signingConfigs {
        release {
            keyAlias System.getenv("CM_KEY_ALIAS")
            keyPassword System.getenv("CM_KEY_PASSWORD")
            storeFile file(System.getenv("CM_KEYSTORE_PATH") ?: "upload-keystore.jks")
            storePassword System.getenv("CM_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.zoomubik.webview"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}
